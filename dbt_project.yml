# Name your project! Project names should contain only lowercase characters
# and underscores. This is why the dbt project name is gotland_pipeline.
name: 'gotland_pipeline'
version: '1.0.0'

# This setting configures which profile dbt uses for this project.
profile: 'gotland_pipeline'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model configuration
models:
  gotland_pipeline:
    staging:
      +materialized: view
      +schema: STAGING

    marts:
      +materialized: table
      +schema: MARTS